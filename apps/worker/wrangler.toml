#:schema node_modules/wrangler/config-schema.json
name = "inboxsieve"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The SPA (apps/web build) is served from the same origin; API, ingest and dev routes hit the Worker first.
# Unknown paths fall through to the Worker, which answers with the prerendered 404 page and status 404.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/h/*", "/dev/*", "/paddle/*", "/app", "/app/*", "/sign-in"]

# Per-minute limits (the binding only supports 10 s or 60 s windows). Longer windows live in D1 (rate_limit_hits).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WEBHOOK_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "inboxsieve"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# One trigger for every job (the Free plan has 5 per account). Every minute: analysis queue + alert retries.
# At :00 instead: plan changes, expiry, reminders, purges (src/index.ts picks by the tick time).
[triggers]
crons = ["* * * * *"]

# Secrets, set with `wrangler secret put <NAME> --env production` (locally in .dev.vars):
#   BETTER_AUTH_SECRET, GROQ_API_KEY, RESEND_API_KEY, PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET, TURNSTILE_SECRET_KEY
#   Optional: GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET turn on "Continue with Google" (both, or it stays off)
# Local defaults below; `--env production` uses the block at the end (see DEPLOY.md).
[vars]
APP_URL = "http://localhost:8787"
INBOUND_DOMAIN = "in.inboxsieve.example"
MAIL_FROM = "InboxSieve <login@inboxsieve.example>"
DEV_ROUTES = "0"
PADDLE_ENV = "sandbox"
PADDLE_CLIENT_TOKEN = ""
PADDLE_PRICE_SOLO_MONTHLY = "pri_solo_monthly_example"
PADDLE_PRICE_SOLO_YEARLY = "pri_solo_yearly_example"
PADDLE_PRICE_AGENCY_MONTHLY = "pri_agency_monthly_example"
PADDLE_PRICE_AGENCY_YEARLY = "pri_agency_yearly_example"
LLM_DAILY_USD_CAP = "3"
LLM_ACCOUNT_DAILY_USD_CAP = "0.25"
OWNER_ALERT_EMAIL = "owner@inboxsieve.example"

# Production: `wrangler deploy --env production`. Bindings aren't inherited, so they are repeated here.
[env.production]
name = "inboxsieve"
routes = [{ pattern = "inboxsieve.com", custom_domain = true }]

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/h/*", "/dev/*", "/paddle/*", "/app", "/app/*", "/sign-in"]

[[env.production.ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "WEBHOOK_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[env.production.d1_databases]]
binding = "DB"
database_name = "inboxsieve"
database_id = "63517062-b177-4a47-8d51-d2a0ddaa59cd"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["* * * * *"]

[env.production.vars]
APP_URL = "https://inboxsieve.com"
INBOUND_DOMAIN = "in.inboxsieve.com"
MAIL_FROM = "InboxSieve <inboxsieve@mail.spacesonlabs.com>"
DEV_ROUTES = "0"
PADDLE_ENV = "production"
PADDLE_CLIENT_TOKEN = "REPLACE_WITH_PADDLE_CLIENT_TOKEN"
PADDLE_PRICE_SOLO_MONTHLY = "REPLACE_WITH_PRICE_ID"
PADDLE_PRICE_SOLO_YEARLY = "REPLACE_WITH_PRICE_ID"
PADDLE_PRICE_AGENCY_MONTHLY = "REPLACE_WITH_PRICE_ID"
PADDLE_PRICE_AGENCY_YEARLY = "REPLACE_WITH_PRICE_ID"
LLM_DAILY_USD_CAP = "3"
LLM_ACCOUNT_DAILY_USD_CAP = "0.25"
OWNER_ALERT_EMAIL = "alerts@spacesonlabs.com"
